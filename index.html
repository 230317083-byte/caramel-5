<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карамель</title>
<style>
:root{--c:#8a4b1f;--bg:#fbf8f3;--l:#e6dccf}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:#2b2118}
input,select,button{font:inherit;padding:8px 10px;border:1px solid #cdbfae;border-radius:6px;background:#fff}
button{background:var(--c);color:#fff;border:0;cursor:pointer}
button.g{background:#fff;color:var(--c);border:1px solid var(--c)}
button.r{background:#a33}
.login{max-width:340px;margin:12vh auto;display:grid;gap:10px;padding:16px}
h1{color:var(--c);margin:0}
.app{display:flex;min-height:100vh}
aside{width:230px;background:var(--c);color:#fff;padding:16px;flex-shrink:0}
aside a{display:block;padding:9px 10px;border-radius:6px;color:#fff;cursor:pointer}
aside a:hover,aside a.on{background:rgba(255,255,255,.18)}
main{flex:1;padding:22px;overflow-x:auto}
form.add,.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border-bottom:1px solid var(--l);padding:8px;text-align:left}
th{background:#f3ece2}
.err{color:#a33}.ok{color:#2a7a3b}
.card{background:#fff;border:1px solid var(--l);border-radius:8px;padding:12px;margin:8px 0}
.kp{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.kp button{background:#fff;color:#2b2118;border:1px solid var(--l);padding:12px 16px;text-align:left}
.kp button.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.kp b{display:block;font-size:18px}
.tabs button{background:#fff;color:var(--c);border:1px solid var(--c)}
.tabs button.on{background:var(--c);color:#fff}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:9}
.mb{background:#fff;border-radius:10px;padding:18px;width:min(380px,92vw);display:grid;gap:10px}
select.st{color:#fff;border:0;font-weight:600}
@media(max-width:700px){.app{flex-direction:column}aside{width:auto}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const ROLES={seller:'Продавец',manager:'Менеджер',admin:'Администратор'};
const ALL=[['obzor','Обзор'],['kassa','Касса'],['zakazy','Заказы'],['sklad','Склад'],['ceh','Цех и сборка'],['vitrina','Витрина'],['klienty','Клиенты'],['sebestoimost','Себестоимость'],['istochniki','Источники заказов'],['ceny','Редактор цен витрины'],['polzovateli','Управление пользователями']];
const ACC={seller:['kassa','zakazy','ceh','vitrina','klienty'],manager:['zakazy','klienty','ceh','vitrina'],admin:ALL.map(a=>a[0])};
const STAT={'Новый':'#2b6cb0','В работе':'#d97706','Готов':'#2f855a','Выдан':'#6b46c1','Отменён':'#c53030'};
const PAY=['Наличные','Карта','QR','Смешанная'];
const INC=['Продажа','Предоплата','Доплата по заказу','Прочий доход'];
const EXP=['Сырьё','Коммуналка','Операционные расходы','Прочий расход'];
const TYPES=['Торт','Десерт','Выпечка','Напиток','Другое'];
const G={
 klienty:[['name','Имя','text'],['phone','Телефон','text']],
 sklad:[['name','Ингредиент','text'],['unit','Ед. изм.','text'],['stock','Остаток','number'],['price','Закупочная цена','number']],
 sebestoimost:[['cake','Изделие','prod'],['ing','Ингредиент','ing'],['qty','Расход на 1 шт.','number'],['cost','Себестоимость','number']],
 istochniki:[['name','Источник','text'],['pct','Комиссия, %','number']],
 ceny:[['name','Название','text'],['type','Вид','sel',TYPES],['p_Витрина','Витрина','number'],['p_Kaspi','Kaspi','number'],['p_Яндекс','Яндекс','number']]
};
const L=k=>{try{return JSON.parse(localStorage.getItem('car2_'+k))}catch(e){return null}};
const S=(k,v)=>{try{localStorage.setItem('car2_'+k,JSON.stringify(v))}catch(e){}};
let mem={};
const get=k=>mem[k]??(mem[k]=L(k)??[]);
const put=(k,v)=>{mem[k]=v;S(k,v)};
if(!get('istochniki').length)put('istochniki',[{name:'Витрина',pct:0},{name:'Kaspi',pct:10},{name:'Яндекс',pct:20},{name:'Заказной',pct:0}]);
let me=null,sec='',msg='',cs='bake',kd='',zc='Витрина',ob={mode:'d',d:'',m:'',card:'inc'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ru-RU')+' ₸';
const day=()=>new Date().toLocaleDateString('en-CA');
const now=()=>new Date().toLocaleString('ru-RU');
const uid=()=>Date.now()+Math.floor(Math.random()*1e4);
const sum=a=>a.reduce((x,y)=>x+y,0);

function modal(html,ok,btn){const d=document.createElement('div');d.className='mo';
 d.innerHTML=`<div class="mb">${html}<div class="row"><button class="g" id="mx">Отмена</button><button id="mk">${btn||'Готово'}</button></div></div>`;
 document.body.appendChild(d);d.querySelector('#mx').onclick=()=>d.remove();
 d.querySelector('#mk').onclick=()=>{if(ok(d)!==false)d.remove()}}
const ask=(cb)=>modal('<b>Вы уверены?</b><span>Запись будет удалена.</span>',()=>{cb()},'Да, удалить');

function setupView(){
 $('#root').innerHTML=`<form class="login"><h1>Карамель</h1><div>Первый запуск: создайте аккаунт владельца (администратора)</div>
 <input id="n" placeholder="Имя" value="Владелец"><input id="l" type="email" value="imangalishaimarddan7@gmail.com" placeholder="Почта">
 <input id="p" type="password" placeholder="Придумайте пароль (от 6 символов)"><input id="p2" type="password" placeholder="Повторите пароль">
 <button type="submit">Создать и войти</button><div class="err" id="m"></div></form>`;
 $('.login').onsubmit=e=>{e.preventDefault();const p=$('#p').value;
  if(p.length<6)return $('#m').textContent='Пароль должен быть не короче 6 символов';
  if(p!==$('#p2').value)return $('#m').textContent='Пароли не совпадают';
  me={login:$('#l').value.trim().toLowerCase(),name:$('#n').value||'Владелец',pass:p,role:'admin',status:'ok',owner:true};
  put('users',[me]);sec='obzor';app()}
}
function loginView(reg){
 if(!get('users').length)return setupView();
 $('#root').innerHTML=`<form class="login"><h1>Карамель</h1><div>${reg?'Заявка на регистрацию':'Вход в систему'}</div>
 ${reg?'<input id="n" placeholder="Имя">':'<select id="r">'+Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')+'</select>'}
 <input id="l" placeholder="Логин"><input id="p" type="password" placeholder="Пароль">
 <button type="submit">${reg?'Отправить заявку':'Войти'}</button><div class="err" id="m">${esc(msg)}</div>
 <a href="#" onclick="msg='';loginView(${!reg});return false">${reg?'Уже есть аккаунт? Войти':'Нет аккаунта? Подать заявку'}</a></form>`;
 $('.login').onsubmit=e=>{e.preventDefault();const l=$('#l').value.trim().toLowerCase(),p=$('#p').value,u=get('users');
  if(reg){if(!l||!p||!$('#n').value)return msg='Заполните все поля',loginView(reg);
   if(u.find(x=>x.login.toLowerCase()===l))return msg='Такой логин уже занят',loginView(reg);
   u.push({login:l,name:$('#n').value,pass:p,role:'',status:'wait'});put('users',u);msg='Заявка отправлена. Ожидайте подтверждения администратором.';return loginView(false)}
  const x=u.find(x=>x.login.toLowerCase()===l&&x.pass===p);
  if(!x){msg='Неверный логин или пароль';return loginView(false)}
  if(x.status!=='ok'){msg='Аккаунт ожидает подтверждения администратором';return loginView(false)}
  if(x.role!==$('#r').value){msg='Выбрана неверная роль для этого аккаунта';return loginView(false)}
  me=x;msg='';sec=ACC[me.role][0];app()};
}
function app(){
 const nav=ALL.filter(a=>ACC[me.role].includes(a[0]));
 $('#root').innerHTML=`<div class="app"><aside><h1 style="color:#fff">Карамель</h1><div style="margin:12px 0">${nav.map(a=>`<a class="${a[0]===sec?'on':''}" onclick="sec='${a[0]}';app()">${a[1]}</a>`).join('')}</div>
 <div style="opacity:.85;font-size:13px">${esc(me.name)}<br>${ROLES[me.role]}</div><p><a onclick="me=null;loginView(false)">Выйти</a></p></aside><main id="v"></main></div>`;
 if(!ACC[me.role].includes(sec))return;
 const V={obzor,kassa,zakazy,ceh,vitrina,polzovateli:users};
 $('#v').innerHTML=`<h2>${ALL.find(a=>a[0]===sec)[1]}</h2>`+(V[sec]?V[sec]():crud(sec));
}
/* ---------- номенклатура ---------- */
const prodSel=(id,v)=>`<select id="${id}" name="${id}">${get('ceny').map(x=>`<option ${x.name===v?'selected':''}>${esc(x.name)}</option>`).join('')||'<option value="">Нет изделий — нажмите «Добавить вариант»</option>'}</select><button type="button" class="g" onclick="addVariant()">Добавить вариант</button>`;
function addVariant(){modal(`<b>Новый вариант</b><input id="vn" placeholder="Название (торт, десерт, выпечка, напиток…)"><select id="vt">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select><input id="vp" type="number" placeholder="Цена на витрине">`,d=>{
 const n=d.querySelector('#vn').value.trim();if(!n)return false;
 const c=get('ceny');if(!c.find(x=>x.name===n))c.push({name:n,type:d.querySelector('#vt').value,'p_Витрина':Number(d.querySelector('#vp').value)||0,'p_Kaspi':0,'p_Яндекс':0});put('ceny',c);app()})}
/* ---------- универсальный список ---------- */
function crud(k){
 const f=G[k];
 const inp=([key,lab,t,o])=>t==='sel'?`<select name="${key}">${o.map(v=>`<option>${v}</option>`).join('')}</select>`
  :t==='prod'?prodSel(key):t==='ing'?`<select name="${key}">${get('sklad').map(x=>`<option>${esc(x.name)}</option>`).join('')}</select>`
  :`<input name="${key}" type="${t}" placeholder="${lab}" ${t==='number'?'step="any"':''}>`;
 return`<form class="add" onsubmit="addG(event,'${k}')">${f.map(inp).join('')}<button>Добавить</button></form><div class="err" id="e"></div>
 <div style="overflow-x:auto"><table><tr>${f.map(x=>`<th>${x[1]}</th>`).join('')}<th></th></tr>${get(k).map((r,i)=>`<tr>${f.map(x=>`<td>${esc(r[x[0]])}</td>`).join('')}<td>${me.role==='admin'?`<button class="r" onclick="ask(()=>delG('${k}',${i}))">Удалить</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9">Пока пусто.</td></tr>'}</table></div>`}
function addG(e,k){e.preventDefault();const r={};
 for(const[a,b]of new FormData(e.target).entries())r[a]=G[k].find(x=>x[0]===a)[2]==='number'?Number(b)||0:b;
 if(!r[G[k][0][0]])return $('#e').textContent='Заполните первое поле';
 const a=get(k);a.push(r);put(k,a);app()}
function delG(k,i){const a=get(k);a.splice(i,1);put(k,a);app()}
/* ---------- касса ---------- */
const myShift=()=>get('shifts').find(s=>s.who===me.login&&!s.closed);
const shExp=s=>s.open+sum(get('kops').filter(o=>o.sh===s.id).map(o=>o.sum));
function opsTable(list,canDel){return`<table><tr><th>Время</th><th>Кто</th><th>Категория</th><th>Сумма</th><th>Комментарий</th><th></th></tr>${list.map(o=>`<tr><td>${esc(o.ts)}</td><td>${esc(o.who)}</td><td>${esc(o.kind)}</td><td>${fmt(o.sum)}</td><td>${esc(o.note)}</td><td>${canDel&&o.kind!=='Инкассация'?`<button class="r" onclick="ask(()=>delOp(${o.id}))">Удалить</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">Записей нет.</td></tr>'}</table>`}
function kassa(){
 if(me.role==='admin')return kassaAdmin();
 const s=myShift();
 if(!s)return`<div class="card"><b>Смена не открыта.</b> Укажите наличные в кассе на начало (размен).<form class="add" onsubmit="openShift(event)"><input name="o" type="number" step="any" placeholder="Начальная сумма" required><button>Открыть смену</button></form></div>`;
 const ops=get('kops').filter(o=>o.sh===s.id).reverse();
 return`<div class="card">Смена открыта: ${esc(s.ts)} · Размен: <b>${fmt(s.open)}</b> · Сейчас в кассе: <b>${fmt(shExp(s))}</b></div>
 <form class="add" onsubmit="addOp(event)"><select name="kind">${INC.map(k=>`<option>${k}</option>`).join('')}${EXP.map(k=>`<option>${k}</option>`).join('')}</select><input name="sum" type="number" step="any" min="0" placeholder="Сумма" required><input name="note" placeholder="Комментарий"><button>Записать</button></form>
 ${opsTable(ops,true)}
 <form class="add" onsubmit="closeShift(event)"><input name="a" type="number" step="any" placeholder="Фактическая сумма в кассе" required><button class="r">Закрыть смену</button></form>`}
function openShift(e){e.preventDefault();const s=get('shifts');s.push({id:uid(),who:me.login,name:me.name,day:day(),open:Number(e.target.o.value)||0,ts:now(),closed:false});put('shifts',s);app()}
function closeShift(e){e.preventDefault();const a=get('shifts'),s=a.find(x=>x.id===myShift().id);s.actual=Number(e.target.a.value)||0;s.exp=shExp(s);s.closed=true;s.cts=now();put('shifts',a);
 alert('Смена закрыта. Ожидалось: '+fmt(s.exp)+', по факту: '+fmt(s.actual)+', разница: '+fmt(s.actual-s.exp));app()}
function postOp(kind,v,note,sh){const o=get('kops');o.push({id:uid(),sh:sh??(myShift()||{}).id??null,who:me.name,day:day(),ts:now(),kind,sum:v,note});put('kops',o)}
function addOp(e){e.preventDefault();const f=e.target,v=Number(f.sum.value)||0;postOp(f.kind.value,INC.includes(f.kind.value)?v:-v,f.note.value);app()}
function delOp(id){put('kops',get('kops').filter(o=>o.id!==id));app()}
function kassaAdmin(){
 kd=kd||day();const sh=get('shifts').filter(s=>s.day===kd),open=get('shifts').filter(s=>!s.closed);
 return`<div class="card"><b>Инкассация</b> ${open.length?'(попадёт в открытую смену: '+esc(open[open.length-1].name)+')':'— нет открытой смены'}
 <form class="add" onsubmit="collect(event)"><input name="a" type="number" min="1" step="any" placeholder="Сумма инкассации" required><input name="n" placeholder="Комментарий"><button ${open.length?'':'disabled'}>Провести инкассацию</button></form></div>
 <div class="row">День: <input type="date" value="${kd}" onchange="kd=this.value;app()"></div>
 ${sh.map(s=>`<div class="card"><b>${esc(s.name)}</b> · открыта ${esc(s.ts)}${s.closed?' · закрыта '+esc(s.cts):' · <span class="ok">идёт сейчас</span>'}<br>Размен: ${fmt(s.open)} · Ожидается: ${fmt(shExp(s))}${s.closed?' · Факт: '+fmt(s.actual)+' · Разница: '+fmt(s.actual-s.exp):''}
 ${opsTable(get('kops').filter(o=>o.sh===s.id),true)}</div>`).join('')||'<p>В этот день смен не было.</p>'}`}
function collect(e){e.preventDefault();const o=get('shifts').filter(s=>!s.closed);if(!o.length)return;postOp('Инкассация',-(Number(e.target.a.value)||0),e.target.n.value,o[o.length-1].id);app()}
/* ---------- витрина ---------- */
function addShow(name,g,price,qty){const a=get('show'),x=a.find(y=>y.name===name&&y.g===g&&y.price===price);x?x.qty+=qty:a.push({id:uid(),name,g,price,qty});put('show',a)}
function vitrina(){return`<form class="add" onsubmit="addV(event)">${prodSel('name')}<input name="g" type="number" min="1" step="1" placeholder="Вес, г" required><input name="price" type="number" step="any" placeholder="Цена" required><input name="qty" type="number" min="1" placeholder="Кол-во" required><button>Добавить</button></form>
 <table><tr><th>Наименование</th><th>Вес, г</th><th>Цена</th><th>Количество</th><th></th></tr>${get('show').map(x=>`<tr><td>${esc(x.name)}</td><td>${x.g}</td><td>${fmt(x.price)}</td><td>${x.qty}</td><td><button class="r" onclick="ask(()=>delV(${x.id}))">Удалить</button></td></tr>`).join('')||'<tr><td colspan="5">На витрине пусто.</td></tr>'}</table>`}
function addV(e){e.preventDefault();const f=e.target;if(!f.name.value)return;addShow(f.name.value,Math.round(Number(f.g.value)),Number(f.price.value),Number(f.qty.value));app()}
function delV(id){put('show',get('show').filter(x=>x.id!==id));app()}
/* ---------- цех и сборка ---------- */
function ceh(){
 const b=get('bakes'),free=b.filter(x=>!x.taken);
 const tabs=`<div class="row tabs"><button class="${cs==='bake'?'on':''}" onclick="cs='bake';app()">Пекари</button><button class="${cs==='asm'?'on':''}" onclick="cs='asm';app()">Сборка</button></div>`;
 if(cs==='bake')return tabs+`<form class="add" onsubmit="addBake(event)">${prodSel('cake')}<input name="recipe" placeholder="Рецепт"><input name="g" type="number" min="1" step="1" placeholder="Вес, г" required><input name="r" type="number" step="any" placeholder="Радиус, см"><input name="h" type="number" step="any" placeholder="Высота, см"><button>Записать выпечку</button></form>
 <div class="err" id="e"></div><table><tr><th>Изделие</th><th>Рецепт</th><th>Вес, г</th><th>Радиус</th><th>Высота</th><th>Пекарь</th><th></th></tr>${free.map(x=>`<tr><td>${esc(x.cake)}</td><td>${esc(x.recipe)}</td><td>${x.g}</td><td>${esc(x.r)}</td><td>${esc(x.h)}</td><td>${esc(x.who)}</td><td><button class="r" onclick="ask(()=>delBake(${x.id}))">Удалить</button></td></tr>`).join('')||'<tr><td colspan="7">Испечённого нет.</td></tr>'}</table>`;
 return tabs+`<h3>Доступно для сборки</h3><table><tr><th>Изделие</th><th>Вес, г</th><th>Радиус</th><th>Высота</th><th></th></tr>${free.map(x=>`<tr><td>${esc(x.cake)}</td><td>${x.g}</td><td>${esc(x.r)}</td><td>${esc(x.h)}</td><td><button onclick="take(${x.id})">Забрать на сборку</button></td></tr>`).join('')||'<tr><td colspan="5">Нет выпечки. Пекари должны записать её на вкладке «Пекари».</td></tr>'}</table>
 <h3>Собрано</h3><table><tr><th>Изделие</th><th>Вес, г</th><th>Назначение</th><th>Сборщик</th></tr>${b.filter(x=>x.taken).map(x=>`<tr><td>${esc(x.cake)}</td><td>${x.g}</td><td>${esc(x.dest)}</td><td>${esc(x.by)}</td></tr>`).join('')||'<tr><td colspan="4">Пока ничего.</td></tr>'}</table>`}
function addBake(e){e.preventDefault();const f=e.target;if(!f.cake.value)return $('#e').textContent='Сначала добавьте изделие: кнопка «Добавить вариант»';
 const c=f.cake.value,b=get('bakes');b.push({id:uid(),cake:c,recipe:f.recipe.value,g:Math.round(Number(f.g.value)),r:f.r.value,h:f.h.value,who:me.name,taken:false});put('bakes',b);
 const sk=get('sklad');get('sebestoimost').filter(x=>x.cake===c&&x.qty).forEach(x=>{const i=sk.find(y=>y.name===x.ing);if(i)i.stock=Math.round((i.stock-x.qty)*1000)/1000}); // автосписание сырья
 put('sklad',sk);app()}
function delBake(id){put('bakes',get('bakes').filter(x=>x.id!==id));app()}
function take(id){const ord=get('orders').filter(o=>!['Выдан','Отменён'].includes(o.st));
 modal(`<b>Куда отправить</b><select id="d"><option value="v">Витрина</option>${ord.map(o=>`<option value="${o.id}">Заказ №${String(o.id).slice(-5)} · ${esc(o.name)}</option>`).join('')}</select><input id="p" type="number" step="any" placeholder="Цена на витрине (если Витрина)">`,d=>{
 const a=get('bakes'),x=a.find(y=>y.id===id),v=d.querySelector('#d').value;
 if(v==='v'){const p=Number(d.querySelector('#p').value);if(!p)return false;addShow(x.cake,x.g,p,1);x.dest='Витрина'}else x.dest='Заказ №'+v.slice(-5);
 x.taken=true;x.by=me.name;put('bakes',a);app()},'Забрать')}
/* ---------- заказы ---------- */
const cakeP=(name,src)=>{const c=get('ceny').find(x=>x.name===name)||{};return Number(c['p_'+src])||Number(c['p_Витрина'])||0};
function itemOpts(src){return src==='Витрина'?get('show').filter(x=>x.qty>0).map(x=>`<option value="${x.id}">${esc(x.name)} (${x.g} г) — ${fmt(x.price)}, в наличии ${x.qty}</option>`).join('')||'<option value="">На витрине ничего нет</option>'
 :get('ceny').map(x=>`<option value="${esc(x.name)}">${esc(x.name)} — ${fmt(cakeP(x.name,src))}</option>`).join('')||'<option value="">Нет изделий</option>'}
function zakazy(){
 const src=get('istochniki').map(x=>x.name);if(!src.includes(zc))zc=src[0];
 return`<form class="add" onsubmit="addZ(event)"><input name="name" placeholder="Клиент" required><input name="phone" placeholder="Телефон">
 <select name="src" onchange="zc=this.value;$('#it').innerHTML=itemOpts(zc)">${src.map(s=>`<option ${s===zc?'selected':''}>${esc(s)}</option>`).join('')}</select>
 <select name="item" id="it">${itemOpts(zc)}</select><button type="button" class="g" onclick="addVariant()">Добавить вариант</button>
 <select name="pay">${PAY.map(p=>`<option>${p}</option>`).join('')}</select><input name="g" type="number" step="1" placeholder="Вес, г"><input name="r" type="number" step="any" placeholder="Радиус, см"><input name="h" type="number" step="any" placeholder="Высота, см">
 <input name="pre" type="number" step="any" placeholder="Предоплата"><input name="addr" placeholder="Адрес"><button>Оформить</button></form><div class="err" id="e"></div>
 <div style="overflow-x:auto"><table><tr><th>№</th><th>Клиент</th><th>Канал</th><th>Изделие</th><th>Итого</th><th>Оплата</th><th>Статус</th><th></th></tr>${get('orders').slice().reverse().map(o=>`<tr><td>${String(o.id).slice(-5)}</td><td>${esc(o.name)}<br><small>${esc(o.phone)} ${esc(o.addr)}</small></td><td>${esc(o.src)}</td><td>${esc(o.item)}${o.g?' · '+o.g+' г':''}</td><td>${fmt(o.total)}${o.pre?'<br><small>предоплата '+fmt(o.pre)+'</small>':''}</td><td>${esc(o.pay)}</td>
 <td><select class="st" style="background:${STAT[o.st]}" onchange="setSt(${o.id},this.value)">${Object.keys(STAT).map(s=>`<option ${s===o.st?'selected':''}>${s}</option>`).join('')}</select></td>
 <td>${me.role==='admin'?`<button class="r" onclick="ask(()=>delZ(${o.id}))">Удалить</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8">Заказов нет.</td></tr>'}</table></div>`}
function addZ(e){e.preventDefault();const f=e.target,src=f.src.value;let item=f.item.value,price=0;
 if(!item)return $('#e').textContent='Выберите изделие';
 if(src==='Витрина'){const s=get('show'),x=s.find(y=>String(y.id)===item);if(!x||x.qty<1)return $('#e').textContent='Товара нет в наличии';x.qty--;if(x.qty<1)s.splice(s.indexOf(x),1);put('show',s);item=x.name;price=x.price}else price=cakeP(item,src);
 const pre=Number(f.pre.value)||0,o=get('orders');o.push({id:uid(),name:f.name.value,phone:f.phone.value,src,item,total:price,pay:f.pay.value,pre,g:f.g.value,r:f.r.value,h:f.h.value,addr:f.addr.value,st:'Новый',who:me.name});put('orders',o);
 if(pre)postOp('Предоплата',pre,'Заказ: '+f.name.value);app()}
function setSt(id,v){const a=get('orders'),o=a.find(x=>x.id===id);o.st=v;
 if(v==='Выдан'&&!o.paid){o.paid=1;const d=o.total-o.pre;if(d>0)postOp('Доплата по заказу',d,'Заказ: '+o.name)}put('orders',a);app()}
function delZ(id){put('orders',get('orders').filter(o=>o.id!==id));app()}
/* ---------- пользователи ---------- */
function users(){return`<table><tr><th>Имя</th><th>Логин</th><th>Роль</th><th>Статус</th><th></th></tr>${get('users').map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${esc(u.login)}</td>
 <td>${u.status==='ok'?ROLES[u.role]:`<select id="ro${i}">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>`}</td>
 <td>${u.status==='ok'?'<span class="ok">Активен</span>':'Ожидает подтверждения'}</td>
 <td>${u.status==='ok'?(u.owner?'':`<button class="r" onclick="ask(()=>ban(${i}))">Отключить</button>`):`<button onclick="okU(${i})">Одобрить</button>`}</td></tr>`).join('')}</table>`}
function okU(i){const u=get('users');u[i].role=$('#ro'+i).value;u[i].status='ok';put('users',u);app()}
function ban(i){const u=get('users');u[i].status='wait';u[i].role='';put('users',u);app()}
/* ---------- обзор ---------- */
const rentAll=()=>{const r=get('rent');return Array.isArray(r)?{}:r};
function obzor(){
 ob.d=ob.d||day();ob.m=ob.m||day().slice(0,7);const D=ob.mode==='d',key=D?ob.d:ob.m;
 const ops=get('kops').filter(o=>o.kind!=='Инкассация'&&(D?o.day===ob.d:o.day.startsWith(ob.m)));
 const inc=ops.filter(o=>o.sum>0),exp=ops.filter(o=>o.sum<0),rent=Number(rentAll()[key])||0;
 const I=sum(inc.map(o=>o.sum)),E=-sum(exp.map(o=>o.sum)),T=I-E-rent,p=D?'день':'месяц';
 const K=(id,t,v)=>`<button class="${ob.card===id?'on':''}" onclick="ob.card='${id}';app()">${t}<b>${fmt(v)}</b></button>`;
 const list=a=>{const g={};a.forEach(o=>{g[o.kind]=g[o.kind]||{n:0,s:0};g[o.kind].n++;g[o.kind].s+=Math.abs(o.sum)});return`<table><tr><th>Категория</th><th>Записей</th><th>Сумма</th></tr>${Object.entries(g).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${fmt(v.s)}</td></tr>`).join('')||'<tr><td colspan="3">Нет данных.</td></tr>'}</table>`+opsTable(a,false)};
 return`<div class="row"><select onchange="ob.mode=this.value;app()"><option value="d" ${D?'selected':''}>День</option><option value="m" ${D?'':'selected'}>Месяц</option></select>
 ${D?`<input type="date" value="${ob.d}" onchange="ob.d=this.value||ob.d;app()">`:`<input type="month" value="${ob.m}" onchange="ob.m=this.value||ob.m;app()">`}</div>
 <div class="kp">${K('inc','Доход за '+p,I)}${K('exp','Расход за '+p,E)}${K('rent','Аренда и ком. услуги',rent)}${K('tot','Итог',T)}</div>
 ${ob.card==='inc'?list(inc):ob.card==='exp'?list(exp):ob.card==='rent'?`<div class="card">Аренда и коммунальные услуги за выбранный период<form class="add" onsubmit="saveRent(event,'${key}')"><input name="r" type="number" step="any" value="${rent}"><button>Сохранить</button></form></div>`
 :`<div class="card">Доход ${fmt(I)} − Расход ${fmt(E)} − Аренда и ком. услуги ${fmt(rent)} = <b>${fmt(T)}</b></div>`}`}
function saveRent(e,k){e.preventDefault();const r=rentAll();r[k]=Number(e.target.r.value)||0;put('rent',r);app()}
loginView(false);
</script>
</body>
</html>
